    <!-- rocket -->
    <path d="M270 260 q0 -30 12 -34 q12 4 12 34 Z M270 260 l-8 10 v-12 Z M294 260 l8 10 v-12 Z"/><circle cx="282" cy="238" r="4"/>
    <!-- burger -->
